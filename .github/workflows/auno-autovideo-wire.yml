name: Wire Auno Auto Video Planner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auno-autovideo-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire Auto Video planner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          routes = Path('apps/server/internal/api/routes.go')
          text = routes.read_text()
          replacements = [
              (
                  '\t"github.com/openpost/backend/internal/services/aiprompts"\n',
                  '\t"github.com/openpost/backend/internal/services/aiprompts"\n\t"github.com/openpost/backend/internal/services/autovideo"\n',
              ),
              (
                  '\tPostBuilder                  postgeneration.Builder\n',
                  '\tPostBuilder                  postgeneration.Builder\n\tAutoVideoPlanner             autovideo.Planner\n',
              ),
              (
                  '\thandlers.NewPostBuilderHandler(deps.DB, deps.Authenticator, deps.PostBuilder).RegisterRoutes(api)\n',
                  '\thandlers.NewPostBuilderHandler(deps.DB, deps.Authenticator, deps.PostBuilder).RegisterRoutes(api)\n\thandlers.NewAutoVideoHandler(deps.DB, deps.Authenticator, deps.AutoVideoPlanner).RegisterRoutes(api)\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing routes anchor: {old!r}')
              text = text.replace(old, new, 1)
          routes.write_text(text)

          main = Path('apps/server/cmd/openpost/main.go')
          text = main.read_text()
          replacements = [
              (
                  '\t"github.com/openpost/backend/internal/services/aiprompts"\n',
                  '\t"github.com/openpost/backend/internal/services/aiprompts"\n\t"github.com/openpost/backend/internal/services/autovideo"\n',
              ),
              (
                  '\tvar imageCaptioner imagecaption.Captioner\n\tvar postBuilder postgeneration.Builder\n',
                  '\tvar imageCaptioner imagecaption.Captioner\n\tvar postBuilder postgeneration.Builder\n\tvar autoVideoPlanner autovideo.Planner\n',
              ),
              (
                  '\t\tlog.Printf(\n\t\t\t"AI post builder enabled with model %s provider %s zero_data_retention=%t",\n\t\t\tcfg.TextGenerationModel,\n\t\t\tcfg.ContentAIProvider,\n\t\t\tcfg.ContentAIRequireZDR,\n\t\t)\n',
                  '\t\tlog.Printf(\n\t\t\t"AI post builder enabled with model %s provider %s zero_data_retention=%t",\n\t\t\tcfg.TextGenerationModel,\n\t\t\tcfg.ContentAIProvider,\n\t\t\tcfg.ContentAIRequireZDR,\n\t\t)\n\t\tautoVideoPlanner, err = autovideo.New(contentGenerator, cfg.TextGenerationModel)\n\t\tif err != nil {\n\t\t\tfatalfWithDiagnostics(diagnosticsReporter, "failed to initialize Auno Auto Video planner: %v", err)\n\t\t}\n\t\tlog.Printf("Auno Auto Video planner enabled with model %s", cfg.TextGenerationModel)\n',
              ),
              (
                  '\t\tPostBuilder:               postBuilder,\n',
                  '\t\tPostBuilder:               postBuilder,\n\t\tAutoVideoPlanner:          autoVideoPlanner,\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing main anchor: {old[:120]!r}')
              text = text.replace(old, new, 1)
          main.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/internal/api/routes.go apps/server/cmd/openpost/main.go
          git commit -m "feat: wire Auno Auto Video planner"
          git push origin HEAD:main
