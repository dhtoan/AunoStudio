name: Wire Auto Video Binary Sources
on:
  push:
    branches: [main]
    paths: [.github/workflows/auno-binary-input.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch binary source upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/routes/auto-video/+page.svelte')
          text = path.read_text()

          anchor = "\timport { workspaceCtx } from '$lib/stores/workspace.svelte';\n"
          addition = anchor + "\timport { uploadMediaFile } from '$lib/media-upload-client';\n"
          if "uploadMediaFile" not in text:
              if anchor not in text: raise SystemExit('missing workspace import anchor')
              text = text.replace(anchor, addition, 1)

          text = text.replace(
              "let sourceKind = $state<'text' | 'url' | 'markdown' | 'txt'>('text');",
              "let sourceKind = $state<'text' | 'url' | 'markdown' | 'txt' | 'pdf' | 'image' | 'video' | 'media'>('text');"
          )
          anchor = "\tlet sourceValue = $state('');\n"
          addition = anchor + "\tlet sourceMediaId = $state('');\n\tlet sourceMimeType = $state('');\n\tlet sourceUploading = $state(false);\n"
          if "let sourceMediaId" not in text:
              if anchor not in text: raise SystemExit('missing source value anchor')
              text = text.replace(anchor, addition, 1)

          anchor = "\tasync function loadTextSourceFile(event: Event): Promise<void> {\n"
          helper = "\tasync function loadMediaSourceFile(event: Event): Promise<void> {\n\t\tconst input = event.currentTarget as HTMLInputElement;\n\t\tconst file = input.files?.[0];\n\t\tif (!file) return;\n\t\terror = '';\n\t\tconst workspaceId = workspaceCtx.currentWorkspace?.id?.trim() ?? '';\n\t\tif (!workspaceId) {\n\t\t\terror = 'Select an Auno Studio workspace before adding a PDF, image, or video source.';\n\t\t\tinput.value = '';\n\t\t\treturn;\n\t\t}\n\t\tif (file.size <= 0 || file.size > 25 * 1024 * 1024) {\n\t\t\terror = 'Multimodal Auto Video source files are limited to 25 MB.';\n\t\t\tinput.value = '';\n\t\t\treturn;\n\t\t}\n\t\tconst kind = file.type === 'application/pdf'\n\t\t\t? 'pdf'\n\t\t\t: file.type.startsWith('image/')\n\t\t\t\t? 'image'\n\t\t\t\t: file.type.startsWith('video/')\n\t\t\t\t\t? 'video'\n\t\t\t\t\t: null;\n\t\tif (!kind) {\n\t\t\terror = 'Choose a PDF, image, or video file.';\n\t\t\tinput.value = '';\n\t\t\treturn;\n\t\t}\n\t\tsourceUploading = true;\n\t\ttry {\n\t\t\tconst uploaded = await uploadMediaFile({\n\t\t\t\tworkspaceId,\n\t\t\t\tfile,\n\t\t\t\tsource: 'upload',\n\t\t\t\tassetKind: 'library',\n\t\t\t\tretentionClass: 'library',\n\t\t\t\tprepareVideo: false\n\t\t\t});\n\t\t\tsourceKind = kind;\n\t\t\tsourceMediaId = uploaded.id;\n\t\t\tsourceMimeType = uploaded.mime_type || file.type;\n\t\t\tsourceValue = `Attached ${kind} source: ${file.name}`;\n\t\t\tif (!title.trim()) title = file.name.replace(/\\.[^.]+$/, '');\n\t\t\tstoryboard = null;\n\t\t\tactiveSource = null;\n\t\t} catch (cause) {\n\t\t\terror = cause instanceof Error ? cause.message : String(cause);\n\t\t} finally {\n\t\t\tsourceUploading = false;\n\t\t\tinput.value = '';\n\t\t}\n\t}\n\n"
          if "async function loadMediaSourceFile" not in text:
              if anchor not in text: raise SystemExit('missing text file helper anchor')
              text = text.replace(anchor, helper + anchor, 1)

          old = "\t\t\turl: sourceKind === 'url' ? value : undefined\n"
          new = "\t\t\turl: sourceKind === 'url' ? value : undefined,\n\t\t\tmimeType: ['pdf', 'image', 'video', 'media'].includes(sourceKind) ? sourceMimeType : undefined,\n\t\t\tmediaId: ['pdf', 'image', 'video', 'media'].includes(sourceKind) ? sourceMediaId : undefined\n"
          if "mediaId: ['pdf'" not in text:
              if old not in text: raise SystemExit('missing createSource URL anchor')
              text = text.replace(old, new, 1)

          old = "\t\t\t\tif (generated) {\n\t\t\t\t\tstoryboard = generated.storyboard;\n\t\t\t\t\tplannerModel = generated.model;\n\t\t\t\t\treturn;\n\t\t\t\t}\n"
          new = old + "\t\t\t\tif (['pdf', 'image', 'video', 'media'].includes(source.kind)) {\n\t\t\t\t\terror = 'A configured multimodal AI provider is required to analyze PDF, image, video, or Media Library sources.';\n\t\t\t\t\treturn;\n\t\t\t\t}\n"
          if "A configured multimodal AI provider is required" not in text:
              if old not in text: raise SystemExit('missing AI result anchor')
              text = text.replace(old, new, 1)

          textarea_label = "\t\t\t<label class=\"block space-y-2 text-sm font-medium\">\n\t\t\t\t<span>{sourceKind === 'url' ? 'Source URL' : 'Source content'}</span>\n"
          if "sourceKind === 'pdf' ? 'PDF source'" not in text:
              replacement = "\t\t\t<label class=\"block space-y-2 text-sm font-medium\">\n\t\t\t\t<span>{sourceKind === 'url' ? 'Source URL' : sourceKind === 'pdf' ? 'PDF source' : sourceKind === 'image' ? 'Image source' : sourceKind === 'video' ? 'Video source' : 'Source content'}</span>\n"
              if textarea_label not in text: raise SystemExit('missing textarea label anchor')
              text = text.replace(textarea_label, replacement, 1)

          text_button_anchor = "\t\t\t\t<span class=\"text-xs text-muted-foreground\">Read locally · up to 1 MB · planner text capped at 200k characters</span>\n\t\t\t</div>\n"
          media_markup = text_button_anchor + "\n\t\t\t<div class=\"flex flex-wrap items-center gap-2\">\n\t\t\t\t<label class=\"inline-flex h-9 cursor-pointer items-center rounded-md border bg-background px-3 text-xs font-medium hover:bg-muted\">\n\t\t\t\t\t{sourceUploading ? 'Uploading source…' : 'Choose PDF / Image / Video'}\n\t\t\t\t\t<input type=\"file\" class=\"sr-only\" accept=\"application/pdf,image/*,video/*\" disabled={sourceUploading} onchange={loadMediaSourceFile} />\n\t\t\t\t</label>\n\t\t\t\t<span class=\"text-xs text-muted-foreground\">Stored in Workspace Media · up to 25 MB · analyzed as multimodal source</span>\n\t\t\t</div>\n"
          if "Choose PDF / Image / Video" not in text:
              if text_button_anchor not in text: raise SystemExit('missing text file UI anchor')
              text = text.replace(text_button_anchor, media_markup, 1)

          path.write_text(text)
          PY
          path='apps/web/src/routes/auto-video/+page.svelte'
          api_path='apps/web/src/routes/auto-video/%2Bpage.svelte'
          encoded="$(base64 -w0 "$path")"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${api_path}?ref=main" --jq .sha)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${api_path}" \
            -f message='feat: accept PDF image and video Auto Video sources' \
            -f branch=main -f content="$encoded" -f sha="$sha" >/dev/null
