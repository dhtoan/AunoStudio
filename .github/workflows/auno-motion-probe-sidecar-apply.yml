name: Apply Auno Motion Probe Sidecar
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auno-motion-probe-sidecar-apply.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/auno_motion_probe_sidecar_patch.py
          for path in apps/web/src/routes/auto-video/+page.svelte apps/web/src/lib/video-editor/components/auno-auto-video-panel.svelte; do
            api_path="${path//+/%2B}"
            encoded="$(base64 -w0 "$path")"
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${api_path}?ref=main" --jq .sha)"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${api_path}" \
              -f message="feat: persist deterministic Motion probe plans" \
              -f branch=main -f content="$encoded" -f sha="$sha" >/dev/null
          done
