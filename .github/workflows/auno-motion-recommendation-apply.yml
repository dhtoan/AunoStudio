name: Apply Auno Motion Style Recommendation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auno-motion-recommendation-apply.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/auno_motion_recommendation_patch.py
          path='apps/web/src/routes/auto-video/+page.svelte'
          api_path='apps/web/src/routes/auto-video/%2Bpage.svelte'
          encoded="$(base64 -w0 "$path")"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${api_path}?ref=main" --jq .sha)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${api_path}" \
            -f message='feat: recommend Motion Style by video format' \
            -f branch=main -f content="$encoded" -f sha="$sha" >/dev/null
