name: Auno Task 19 Red Gate

on:
  push:
    branches:
      - codex/task19-vox-motion-e2e
    paths:
      - 'tests/app/auno/**'
      - '.github/workflows/auno-task19-red.yml'
  pull_request:
    paths:
      - 'tests/app/auno/**'
      - '.github/workflows/auno-task19-red.yml'
  workflow_dispatch:

jobs:
  browser-red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: apps/server/go.sum
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run Task 19 red browser gates
        run: >-
          bunx playwright test --config tests/app/playwright.config.ts
          tests/app/auno/motion-determinism.spec.ts
          tests/app/auno/motion-visual-qa.spec.ts
          --workers=1
