name: Auno Task 19 Red Gate

on:
  push:
    branches:
      - codex/task19-vox-motion-e2e
    paths:
      - 'tests/app/auno/**'
      - 'apps/server/cmd/openpost/auno_*'
      - 'apps/web/src/lib/auno/**'
      - 'apps/web/src/hooks.client.ts'
      - 'tests/app/playwright.config.ts'
      - '.github/workflows/auno-task19-red.yml'
  pull_request:
    paths:
      - 'tests/app/auno/**'
      - 'apps/server/cmd/openpost/auno_*'
      - 'apps/web/src/lib/auno/**'
      - 'apps/web/src/hooks.client.ts'
      - 'tests/app/playwright.config.ts'
      - '.github/workflows/auno-task19-red.yml'
  workflow_dispatch:

jobs:
  browser-red:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: apps/server/go.sum
      - name: Install dependencies and expose baseline lock drift
        run: |
          bun install
          if ! git diff --quiet -- bun.lock; then
            echo '::warning::bun.lock is stale on the current main baseline; showing generated lock diff'
            git diff -- bun.lock | head -n 240
          fi
      - name: Run dev fixture generator contracts
        run: >-
          cd apps/server && go test -tags dev ./cmd/openpost
          -run 'TestAuno(E2EPlannerGeneratorIsOptInAndStructured|PlannerGeneratorUsesE2EFixtureWhenExplicitlyEnabled)'
          -count=1 -v
      - name: Build production web embed
        run: bun run build -- frontend
      - name: Run production fixture guard contract
        run: cd apps/server && go test ./cmd/openpost -run TestAunoE2EPlannerGeneratorIsUnavailableInProduction -count=1 -v
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run Task 19 browser gates
        run: >-
          bunx playwright test --config tests/app/playwright.config.ts
          tests/app/auno/motion-determinism.spec.ts
          tests/app/auno/motion-visual-qa.spec.ts
          tests/app/auno/vox-documentary.spec.ts
          --workers=1
