name: Verify Task 18 motion provenance and parity

on:
  push:
    paths:
      - .github/workflows/auno-task18-verify.yml

jobs:
  task18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Install workspace dependencies for focused verification
        run: bun install
      - name: Verify Bang Motion provenance
        run: bun scripts/check-bang-motion-vendor.mjs
      - name: Verify third-party notices
        run: bun scripts/check-third-party-notices.mjs
      - name: Verify deterministic easing
        run: bun test packages/auno-motion/src/easing.test.ts packages/auno-motion/src/determinism-guard.test.ts
      - name: Verify headless motion compiler
        run: cd apps/server && go test ./internal/aunomotion -v
      - name: Verify web cross-runtime contract
        run: bun --cwd apps/web x vitest run src/lib/auno/motion/cross-runtime-contract.test.ts
