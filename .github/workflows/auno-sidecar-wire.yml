name: Wire Auno Auto Video Sidecar

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auno-sidecar-wire.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire sidecar routes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          handler = Path('apps/server/internal/api/handlers/auto_video_projects.go')
          text = handler.read_text()
          if '\t"time"\n' not in text:
              anchor = '\t"strings"\n'
              if anchor not in text:
                  raise SystemExit('missing time import anchor')
              text = text.replace(anchor, anchor + '\t"time"\n', 1)
          text = text.replace('timeFormatRFC3339Nano', 'time.RFC3339Nano')
          handler.write_text(text)

          routes = Path('apps/server/internal/api/routes.go')
          text = routes.read_text()
          anchor = '\thandlers.NewAutoVideoHandler(deps.DB, deps.Authenticator, deps.AutoVideoPlanner).RegisterRoutes(api)\n'
          addition = anchor + '\thandlers.NewAutoVideoProjectHandler(deps.DB, deps.Authenticator).RegisterRoutes(api)\n'
          if 'NewAutoVideoProjectHandler' not in text:
              if anchor not in text:
                  raise SystemExit('missing Auto Video route anchor')
              text = text.replace(anchor, addition, 1)
          routes.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/internal/api/handlers/auto_video_projects.go apps/server/internal/api/routes.go
          git commit -m "feat: register durable Auto Video metadata API"
          git push origin HEAD:main
