name: Apply Auno Motion Variation Controls
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auno-motion-variation-apply.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/auno_motion_variation_patch.py
          path='apps/web/src/lib/video-editor/components/auno-auto-video-panel.svelte'
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .sha)"
          encoded="$(base64 -w0 "$path")"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='feat: add deterministic Motion variations' \
            -f branch=main -f content="$encoded" -f sha="$sha" >/dev/null
