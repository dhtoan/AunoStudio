name: Apply documentary capability wiring

on:
  push:
    paths:
      - .github/workflows/auno-documentary-capabilities-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch documentary capability source
        run: python3 scripts/auno_documentary_capabilities_patch.py
      - name: Commit source wiring
        run: |
          git config user.name "Auno Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/server/internal/api/handlers/auto_video.go apps/web/src/lib/components/auno-documentary/documentary-wizard.svelte
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "feat: wire documentary degraded capabilities"
            git push origin HEAD:main
          fi
