name: Wire Auno AI Settings
on:
  push:
    branches: [main]
    paths: [.github/workflows/auno-settings-ai-wire.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch settings loader and upload source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/routes/settings/+page.svelte')
          text = path.read_text()
          anchor = "\t\tgeneral: () => import('$lib/components/settings/WorkspacePreferencesSettings.svelte'),\n"
          addition = anchor + "\t\tai: () => import('$lib/components/settings/AunoAISettingsTab.svelte'),\n"
          if "AunoAISettingsTab.svelte" not in text:
              if anchor not in text:
                  raise SystemExit('missing settings loader anchor')
              text = text.replace(anchor, addition, 1)
          path.write_text(text)
          PY
          path='apps/web/src/routes/settings/+page.svelte'
          api_path='apps/web/src/routes/settings/%2Bpage.svelte'
          encoded="$(base64 -w0 "$path")"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${api_path}?ref=main" --jq .sha)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${api_path}" \
            -f message='feat: load Auno AI settings panel' \
            -f branch=main -f content="$encoded" -f sha="$sha" >/dev/null
