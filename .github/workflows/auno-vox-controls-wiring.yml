name: Apply Auno Vox motion controls

on:
  push:
    paths:
      - .github/workflows/auno-vox-controls-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Vox motion controls
        run: python3 scripts/auno_vox_controls_patch.py
      - name: Commit source wiring
        run: |
          git config user.name "Auno Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/lib/video-editor/project/types.ts apps/web/src/lib/video-editor/sequences/composition-controls.ts apps/web/src/lib/video-editor/components/composition-controls-authoring.svelte apps/web/src/lib/auno/motion/motion-composition.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: expose editable Vox motion controls"
          git push origin HEAD:main

# retry: aligned with current resolver
