name: Apply Auno Source Patch
on:
  push:
    branches: [main]
    paths: [.github/workflows/auno-one-shot-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/auno-wire-gemini.py
      - name: Upload patched source through GitHub Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upload_file() {
            path="$1"
            encoded="$(base64 -w0 "$path")"
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .sha 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                -f message="feat: route Auto Video through official Gemini provider" \
                -f branch=main \
                -f content="$encoded" \
                -f sha="$sha" >/dev/null
            else
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                -f message="feat: route Auto Video through official Gemini provider" \
                -f branch=main \
                -f content="$encoded" >/dev/null
            fi
          }
          upload_file apps/server/internal/ai/gemini.go
          upload_file apps/server/cmd/openpost/auno_ai_routing.go
          upload_file apps/server/cmd/openpost/main.go
          upload_file .env.example
