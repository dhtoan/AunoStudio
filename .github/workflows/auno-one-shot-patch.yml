name: Apply Auno Source Patch
on:
  push:
    branches: [main]
    paths: [.github/workflows/auno-one-shot-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/auno-wire-gemini.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/internal/ai/gemini.go apps/server/cmd/openpost/auno_ai_routing.go apps/server/cmd/openpost/main.go .env.example
          git commit -m "feat: route Auto Video through official Gemini provider"
          git push origin HEAD:main
