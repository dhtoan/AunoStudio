name: Wire Native Auno Motion Composition Controls
on:
  push:
    branches: [main]
    paths: [.github/workflows/auno-motion-native-controls.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch native composition controls and deterministic keyframes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Extend the native OpenPost composition-control contract.
          path = Path('apps/web/src/lib/video-editor/project/types.ts')
          text = path.read_text()
          old = '''export type CompositionControlProperty =
\t| 'text.text'
\t| 'text.color'
\t| 'shape.fillColor'
\t| 'shape.strokeColor';
export type CompositionControlKind = 'text' | 'color';
export interface CompositionControlDefinition {
\tid: string;
\tname: string;
\ttargetItemId: string;
\tproperty: CompositionControlProperty;
\tkind: CompositionControlKind;
\tdefaultValue: string;
}
'''
          new = '''export type CompositionControlProperty =
\t| 'text.text'
\t| 'text.color'
\t| 'shape.fillColor'
\t| 'shape.strokeColor'
\t| 'shape.shapeType'
\t| 'motion.intensity'
\t| 'motion.depth'
\t| 'motion.speed';
export type CompositionControlKind = 'text' | 'color' | 'number' | 'select';
export interface CompositionControlOption {
\tvalue: string;
\tlabel: string;
}
export interface CompositionControlDefinition {
\tid: string;
\tname: string;
\ttargetItemId: string;
\tproperty: CompositionControlProperty;
\tkind: CompositionControlKind;
\tdefaultValue: string;
\t/** Optional bounds for numeric controls. Values remain serialized as strings for bundle compatibility. */
\tmin?: number;
\tmax?: number;
\tstep?: number;
\t/** Bounded options for select controls. */
\toptions?: CompositionControlOption[];
}
'''
          if old not in text: raise SystemExit('missing composition control type anchor')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 2) Extend the one native override resolver instead of creating an Auno-only path.
          path = Path('apps/web/src/lib/video-editor/sequences/composition-controls.ts')
          text = path.read_text()
          old = '''\t\tcase 'shape.strokeColor':
\t\t\treturn item.type === 'shape' && item.strokeEnabled ? (item.strokeColor ?? '#ffffff') : null;
\t}
}
'''
          new = '''\t\tcase 'shape.strokeColor':
\t\t\treturn item.type === 'shape' && item.strokeEnabled ? (item.strokeColor ?? '#ffffff') : null;
\t\tcase 'shape.shapeType':
\t\t\treturn item.type === 'shape' ? item.shapeType : null;
\t\tcase 'motion.intensity':
\t\tcase 'motion.depth':
\t\tcase 'motion.speed':
\t\t\treturn null;
\t}
}
'''
          if old not in text: raise SystemExit('missing readControlValue anchor')
          text = text.replace(old, new, 1)

          old = '''\t\tcase 'shape.strokeColor':
\t\t\treturn item.type === 'shape' && item.strokeColor !== value
\t\t\t\t? { ...item, strokeColor: value }
\t\t\t\t: item;
\t}
}

export function applyCompositionControlOverrides(
'''
          new = '''\t\tcase 'shape.strokeColor':
\t\t\treturn item.type === 'shape' && item.strokeColor !== value
\t\t\t\t? { ...item, strokeColor: value }
\t\t\t\t: item;
\t\tcase 'shape.shapeType':
\t\t\treturn item.type === 'shape' && ['rectangle', 'circle', 'ellipse'].includes(value)
\t\t\t\t? { ...item, shapeType: value as 'rectangle' | 'circle' | 'ellipse' }
\t\t\t\t: item;
\t\tcase 'motion.intensity':
\t\tcase 'motion.depth':
\t\tcase 'motion.speed':
\t\t\treturn item;
\t}
}

function boundedNumber(
\tcontrol: CompositionControlDefinition | undefined,
\toverrides: CompositionControlOverrides,
\tfallback: number
): number {
\tif (!control) return fallback;
\tconst raw = overrides[control.id];
\tif (raw === undefined) return fallback;
\tconst parsed = Number(raw);
\tif (!Number.isFinite(parsed)) return fallback;
\tconst min = Number.isFinite(control.min) ? (control.min as number) : parsed;
\tconst max = Number.isFinite(control.max) ? (control.max as number) : parsed;
\treturn Math.min(Math.max(parsed, Math.min(min, max)), Math.max(min, max));
}

function tuneTrack(
\ttrack: NonNullable<TimelineItem['keyframes']>[string & keyof NonNullable<TimelineItem['keyframes']>],
\tproperty: string,
\tdurationInFrames: number,
\tintensity: number,
\tdepth: number,
\tspeed: number
) {
\tif (!track) return track;
\tconst end = Math.max(1, durationInFrames - 1);
\tconst first = track.values[0] ?? 0;
\tconst values = track.values.map((value) => {
\t\tlet next = first + (value - first) * intensity;
\t\tif (property === 'scaleX' || property === 'scaleY') next = 1 + (next - 1) * depth;
\t\treturn next;
\t});
\tconst frames = track.frames.map((frame, index) => {
\t\tif (index === 0) return Math.max(0, Math.min(end, frame));
\t\treturn Math.max(0, Math.min(end, Math.round(frame / speed)));
\t});
\tfor (let index = 1; index < frames.length; index += 1) {
\t\tframes[index] = Math.min(end, Math.max(frames[index], frames[index - 1]));
\t}
\treturn { ...track, frames, values };
}

function applyMotionControlOverrides(
\titems: readonly TimelineItem[],
\tschema: CompositionControlSchema,
\toverrides: CompositionControlOverrides
): TimelineItem[] {
\tconst intensityControl = schema.controls.find((control) => control.property === 'motion.intensity');
\tconst depthControl = schema.controls.find((control) => control.property === 'motion.depth');
\tconst speedControl = schema.controls.find((control) => control.property === 'motion.speed');
\tconst intensity = boundedNumber(intensityControl, overrides, 1);
\tconst depth = boundedNumber(depthControl, overrides, 1);
\tconst speed = boundedNumber(speedControl, overrides, 1);
\tif (intensity === 1 && depth === 1 && speed === 1) return Array.isArray(items) ? [...items] : Array.from(items);
\n\treturn items.map((item) => {
\t\tconst sourceKeyframes = item.keyframes;
\t\tlet keyframes = sourceKeyframes;
\t\tif (sourceKeyframes) {
\t\t\tkeyframes = Object.fromEntries(
\t\t\t\tObject.entries(sourceKeyframes).map(([property, track]) => [
\t\t\t\t\tproperty,
\t\t\t\t\ttuneTrack(track, property, item.durationInFrames, intensity, depth, speed)
\t\t\t\t])
\t\t\t) as typeof sourceKeyframes;
\t\t}
\t\tconst transform = item.transform
\t\t\t? {
\t\t\t\t\t...item.transform,
\t\t\t\t\tscaleX: 1 + ((item.transform.scaleX ?? 1) - 1) * depth,
\t\t\t\t\tscaleY: 1 + ((item.transform.scaleY ?? 1) - 1) * depth
\t\t\t\t}
\t\t\t: item.transform;
\t\treturn keyframes === sourceKeyframes && transform === item.transform ? item : { ...item, keyframes, transform };
\t});
}

export function applyCompositionControlOverrides(
'''
          if old not in text: raise SystemExit('missing applyControlValue anchor')
