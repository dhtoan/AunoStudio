name: Sync Auno Motion Ownership And Voice Timing
on:
  push:
    branches: [main]
    paths: [.github/workflows/auno-motion-timing-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch ownership and voice motion reflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          route = Path('apps/web/src/routes/auto-video/+page.svelte')
          text = route.read_text()
          old = "\t\t\t\t\t\townedItemIds: [`${scene.id}-background`, `${scene.id}-text`],\n"
          new = "\t\t\t\t\t\townedItemIds: [\n\t\t\t\t\t\t\t`${scene.id}-background`,\n\t\t\t\t\t\t\t`${scene.id}-text`,\n\t\t\t\t\t\t\t...(scene.visualIntent === 'motion-composition'\n\t\t\t\t\t\t\t\t? [`${scene.id}-motion-composition`]\n\t\t\t\t\t\t\t\t: [])\n\t\t\t\t\t\t],\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif "`${scene.id}-motion-composition`" not in text:
              raise SystemExit('missing ownership anchor')
          route.write_text(text)

          panel = Path('apps/web/src/lib/video-editor/components/auno-auto-video-panel.svelte')
          text = panel.read_text()
          old = "\t\t\tawait persistSidecar(result.sidecar);\n\t\t\tonautosave();\n\t\t\tstatus = `Generated ${result.assets.length} editable voice clip(s) and retimed scenes from real speech duration.`;\n"
          new = "\t\t\tlet nextSidecar = result.sidecar;\n\t\t\tconst project = editorSession.project;\n\t\t\tconst savedMotion = nextSidecar.generationGraph?.motion;\n\t\t\tif (project && savedMotion && savedMotion.style in MOTION_STYLES) {\n\t\t\t\tconst style = savedMotion.style as MotionStyleId;\n\t\t\t\tconst graph = planMotionGraph({\n\t\t\t\t\tprojectId,\n\t\t\t\t\tstyle,\n\t\t\t\t\tseed: savedMotion.seed,\n\t\t\t\t\tscenes: nextSidecar.storyboard.scenes\n\t\t\t\t});\n\t\t\t\tapplyMotionGraphToLiveTimeline({\n\t\t\t\t\tgraph,\n\t\t\t\t\twidth: project.metadata.width,\n\t\t\t\t\theight: project.metadata.height\n\t\t\t\t});\n\t\t\t\tnextSidecar = {\n\t\t\t\t\t...nextSidecar,\n\t\t\t\t\tupdatedAt: Date.now(),\n\t\t\t\t\tproviderManifest: { ...nextSidecar.providerManifest, motion: `auno-motion:${style}` },\n\t\t\t\t\tgenerationGraph: {\n\t\t\t\t\t\t...nextSidecar.generationGraph,\n\t\t\t\t\t\tversion: 1,\n\t\t\t\t\t\tblocks: nextSidecar.generationGraph?.blocks ?? [],\n\t\t\t\t\t\tmotion: { schemaVersion: 1, style: graph.style, seed: graph.seed }\n\t\t\t\t\t}\n\t\t\t\t};\n\t\t\t}\n\t\t\tawait persistSidecar(nextSidecar);\n\t\t\tonautosave();\n\t\t\tstatus = `Generated ${result.assets.length} editable voice clip(s), retimed scenes from real speech duration, and reflowed native motion.`;\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif "reflowed native motion" not in text:
              raise SystemExit('missing voice persistence anchor')
          panel.write_text(text)
          PY

          upload() {
            path="$1"
            api_path="$2"
            message="$3"
            encoded="$(base64 -w0 "$path")"
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${api_path}?ref=main" --jq .sha)"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${api_path}" \
              -f message="$message" -f branch=main -f content="$encoded" -f sha="$sha" >/dev/null
          }
          upload 'apps/web/src/routes/auto-video/+page.svelte' 'apps/web/src/routes/auto-video/%2Bpage.svelte' 'fix: track Motion Composition ownership in Auto Video sidecar'
          upload 'apps/web/src/lib/video-editor/components/auno-auto-video-panel.svelte' 'apps/web/src/lib/video-editor/components/auno-auto-video-panel.svelte' 'fix: reflow Auno Motion after real TTS timing'
