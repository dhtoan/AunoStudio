name: Auno Container Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: auno-container-release-ghcr-io-dhtoan-aunostudio
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  BUN_VERSION: "1.3.11"
  IMAGE_NAME: ghcr.io/dhtoan/aunostudio

jobs:
  publish:
    name: Build, verify, and publish linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a stable semantic version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Only stable vMAJOR.MINOR.PATCH tags may publish the latest container." >&2
            exit 1
          }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build canonical frontend
        run: bun run build -- frontend

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and smoke-test the release image
        shell: bash
        run: |
          set -euo pipefail
          candidate="auno-studio-release:${GITHUB_SHA}"
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --build-context frontend_artifact=apps/server/cmd/openpost/public \
            --file deploy/docker/Dockerfile \
            --tag "$candidate" \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --cache-from type=gha,scope=auno-studio-production \
            --cache-to type=gha,mode=max,scope=auno-studio-production \
            .
          scripts/smoke-production-image.sh "$candidate" "$GITHUB_SHA" "$GITHUB_REF_NAME"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable, version, and latest tags
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          candidate="auno-studio-release:${GITHUB_SHA}"
          release_ref="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          version_ref="${IMAGE_NAME}:${{ steps.version.outputs.version }}"
          latest_ref="${IMAGE_NAME}:latest"

          for image in "$release_ref" "$version_ref" "$latest_ref"; do
            docker tag "$candidate" "$image"
            docker push "$image"
          done

          release_digest="$(docker buildx imagetools inspect "$release_ref" | awk '$1 == "Digest:" { print $2; exit }')"
          latest_digest="$(docker buildx imagetools inspect "$latest_ref" | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "$release_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$latest_digest" == "$release_digest" ]]

          docker pull "$latest_ref"
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$latest_ref")" == "$GITHUB_REF_NAME" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$latest_ref")" == "$GITHUB_SHA" ]]

          echo "digest=$release_digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Published Auno Studio container"
            echo
            echo "- \`$release_ref\`"
            echo "- \`$version_ref\`"
            echo "- \`$latest_ref\`"
            echo "- Digest: \`$release_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
