name: Apply Auno documentary beat editor wiring

on:
  push:
    paths:
      - .github/workflows/auno-documentary-beat-editor-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch selective beat editing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          handler = Path('apps/server/internal/api/handlers/auto_video_documentary.go')
          text = handler.read_text()
          type_anchor = '''type GenerateDocumentaryStepInput struct {\n\tPathID string `path:"run_id" doc:"Documentary run ID"`\n\tBody   struct {\n\t\tWorkspaceID       string `json:"workspace_id" required:"true" minLength:"1"`\n\t\tGenerationVersion int64  `json:"generation_version" required:"true" minimum:"1"`\n\t}\n}\n'''
          type_insert = type_anchor + '''\ntype GenerateDocumentaryVisualStepInput struct {\n\tPathID     string `path:"run_id" doc:"Documentary run ID"`\n\tPathBeatID string `path:"beat_id" doc:"Documentary beat ID"`\n\tBody       struct {\n\t\tWorkspaceID       string `json:"workspace_id" required:"true" minLength:"1"`\n\t\tGenerationVersion int64  `json:"generation_version" required:"true" minimum:"1"`\n\t}\n}\n'''
          if 'type GenerateDocumentaryVisualStepInput' not in text:
              if type_anchor not in text:
                  raise SystemExit('documentary step type anchor missing')
              text = text.replace(type_anchor, type_insert, 1)
          route_anchor = '''\thuma.Register(api, documentaryOperation("generate-auno-documentary-visuals", http.MethodPost, "/auno/auto-video/documentary/runs/{run_id}/visuals", "Generate documentary visual plans", auth), h.generateVisuals)\n'''
          route_insert = route_anchor + '''\thuma.Register(api, documentaryOperation("regenerate-auno-documentary-beat-visual", http.MethodPost, "/auno/auto-video/documentary/runs/{run_id}/visuals/{beat_id}", "Regenerate one documentary beat visual", auth), h.regenerateVisual)\n'''
          if 'regenerate-auno-documentary-beat-visual' not in text:
              if route_anchor not in text:
                  raise SystemExit('selective visual route anchor missing')
              text = text.replace(route_anchor, route_insert, 1)
          handler.write_text(text)

          generation = Path('apps/server/internal/api/handlers/auto_video_documentary_generation.go')
          text = generation.read_text()
          visual_anchor = '''func (h *DocumentaryHandler) generateThumbnails(ctx context.Context, input *GenerateDocumentaryStepInput) (*DocumentaryRunOutput, error) {\n'''
          selective = r'''func (h *DocumentaryHandler) regenerateVisual(ctx context.Context, input *GenerateDocumentaryVisualStepInput) (*DocumentaryRunOutput, error) {
	stepInput := &GenerateDocumentaryStepInput{PathID: input.PathID}
	stepInput.Body.WorkspaceID = input.Body.WorkspaceID
	stepInput.Body.GenerationVersion = input.Body.GenerationVersion
	run, err := h.generationRun(ctx, stepInput, true)
	if err != nil {
		return nil, err
	}
	beatIndex := -1
	for index := range run.Beats {
		if run.Beats[index].ID == input.PathBeatID {
			beatIndex = index
			break
		}
	}
	if beatIndex < 0 {
		return nil, huma.Error404NotFound("documentary beat was not found")
	}
	source, parts, err := h.sourceForPlanning(ctx, input.Body.WorkspaceID, run.Source)
	if err != nil {
		return nil, err
	}
	result, err := h.planner.GenerateVisuals(ctx, documentary.VisualsInput{
		RunID: run.ID, Language: run.Language, Beats: []documentary.Beat{run.Beats[beatIndex]}, Source: source, Parts: parts,
	})
	if err != nil {
		return nil, documentaryPlannerHTTPError(err)
	}
	if len(result.Plans) != 1 {
		return nil, documentaryPlannerHTTPError(documentary.ErrInvalidResponse)
	}
	plan := result.Plans[0]
	replaced := false
	for index := range run.VisualPlans {
		if run.VisualPlans[index].BeatID == plan.BeatID {
			run.VisualPlans[index] = plan
			replaced = true
			break
		}
	}
	if !replaced {
		run.VisualPlans = append(run.VisualPlans, plan)
	}
	run.Beats[beatIndex].VisualIntent = plan.VisualIntent
	run.Beats[beatIndex].RequiredSubjectIDs = append([]string(nil), plan.RequiredSubjectIDs...)
	run.CurrentStep = documentary.StepVisuals
	setDocumentaryProvider(run, "visuals", result.Model)
	return h.persistGeneration(ctx, stepInput, run)
}

'''
          if 'func (h *DocumentaryHandler) regenerateVisual' not in text:
              if visual_anchor not in text:
                  raise SystemExit('generation selective visual anchor missing')
              text = text.replace(visual_anchor, selective + visual_anchor, 1)
          generation.write_text(text)

          api = Path('apps/web/src/lib/auno/documentary/api.ts')
          text = api.read_text()
          api_anchor = '''export const generateDocumentaryVisuals = (workspaceId: string, run: DocumentaryRun) =>\n\tgenerateStep(workspaceId, run, 'visuals');\n'''
          api_insert = api_anchor + '''export async function regenerateDocumentaryVisual(\n\tworkspaceId: string,\n\trun: DocumentaryRun,\n\tbeatId: string\n): Promise<DocumentaryRun> {\n\tconst response = await fetch(\n\t\t`/api/v1/auno/auto-video/documentary/runs/${encodeURIComponent(run.id)}/visuals/${encodeURIComponent(beatId)}`,\n\t\t{\n\t\t\tmethod: 'POST',\n\t\t\tcredentials: 'include',\n\t\t\theaders: requestHeaders(),\n\t\t\tbody: JSON.stringify({ workspace_id: workspaceId, generation_version: run.generationVersion })\n\t\t}\n\t);\n\treturn readRun(response, 'Regenerating documentary beat visual');\n}\n'''
          if 'regenerateDocumentaryVisual(' not in text:
              if api_anchor not in text:
                  raise SystemExit('documentary API visual anchor missing')
              text = text.replace(api_anchor, api_insert, 1)
          api.write_text(text)

          wizard = Path('apps/web/src/lib/components/auno-documentary/documentary-wizard.svelte')
          text = wizard.read_text()
          import_anchor = '''\t\tgenerateDocumentaryVisuals,\n'''
          if 'regenerateDocumentaryVisual,' not in text:
              if import_anchor not in text:
                  raise SystemExit('wizard API import anchor missing')
              text = text.replace(import_anchor, import_anchor + '''\t\tregenerateDocumentaryVisual,\n''', 1)
          component_anchor = '''\timport DocumentaryIdeas from './documentary-ideas.svelte';\n'''
          if "documentary-beat-editor.svelte" not in text:
              text = text.replace(component_anchor, component_anchor + "\timport DocumentaryBeatEditor from './documentary-beat-editor.svelte';\n", 1)
          function_anchor = '''\tasync function generateVisuals(): Promise<void> {\n'''
          edit_functions = r'''	async function saveBeats(beats: DocumentaryRun['beats']): Promise<void> {
		await saveRun('beat-edit', (next) => {
			next.beats = beats;
			next.currentStep = 'beats';
		});
	}

	async function saveVisualPlans(plans: DocumentaryRun['visualPlans']): Promise<void> {
		await saveRun('visual-edit', (next) => {
			next.visualPlans = plans;
			next.currentStep = 'visuals';
		});
	}

	async function regenerateBeatVisual(beatId: string): Promise<void> {
		if (!run) return;
		error = '';
		busyAction = `visual:${beatId}`;
		try {
			run = await regenerateDocumentaryVisual(workspaceId(), run, beatId);
		} catch (cause) {
			setFailure(cause);
		} finally {
			busyAction = '';
		}
	}

'''
          if 'async function saveBeats(' not in text:
              if function_anchor not in text:
                  raise SystemExit('wizard edit function anchor missing')
              text = text.replace(function_anchor, edit_functions + function_anchor, 1)
          old_beats = r'''					{#if run.beats.length > 0}
						<div class="max-h-[36rem] space-y-2 overflow-y-auto pr-1">
							{#each run.beats as beat (beat.id)}
								<div class="grid gap-2 rounded-lg border bg-muted/20 p-3 sm:grid-cols-[5rem_1fr_9rem]">
									<span class="text-xs text-muted-foreground">{beat.startSeconds.toFixed(1)}–{(beat.startSeconds + beat.durationSeconds).toFixed(1)}s</span>
									<span class="text-sm">{beat.narration}</span>
									<span class="text-xs text-muted-foreground sm:text-right">{beat.visualIntent}</span>
								</div>
							{/each}
						</div>
					{/if}
'''
          new_beats = r'''					{#if run.beats.length > 0}
						<DocumentaryBeatEditor
							beats={run.beats}
							visualPlans={run.visualPlans}
							disabled={busyAction !== ''}
							onchange={saveBeats}
							onvisualchange={saveVisualPlans}
							onregeneratevisual={run.visualPlans.length > 0 ? regenerateBeatVisual : undefined}
						/>
					{/if}
'''
          if '<DocumentaryBeatEditor' not in text:
              if old_beats not in text:
                  raise SystemExit('wizard beats markup anchor missing')
              text = text.replace(old_beats, new_beats, 1)
          wizard.write_text(text)
          PY
      - name: Commit source wiring
        shell: bash
        run: |
          git config user.name "Auno Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/server/internal/api/handlers/auto_video_documentary.go apps/server/internal/api/handlers/auto_video_documentary_generation.go apps/web/src/lib/auno/documentary/api.ts apps/web/src/lib/components/auno-documentary/documentary-wizard.svelte
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add selective documentary beat visual editing"
          git push origin HEAD:main
