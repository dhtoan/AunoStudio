name: Apply documentary native handoff wiring

on:
  push:
    paths:
      - .github/workflows/auno-documentary-handoff-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch native handoff source
        run: python3 scripts/auno_documentary_handoff_patch.py
      - name: Commit source wiring
        run: |
          git config user.name "Auno Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/server/internal/api/handlers/auto_video_documentary.go apps/web/src/lib/components/auno-documentary/documentary-wizard.svelte
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: open documentaries as native editor projects"
          git push origin HEAD:main
