name: Apply documentary compiler fix

on:
  push:
    paths:
      - .github/workflows/auno-documentary-compiler-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch compiler source
        run: python3 scripts/auno_documentary_compiler_fix.py
      - name: Commit source fix
        run: |
          git config user.name "Auno Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/lib/auno/documentary/compiler.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: use portable documentary placeholder background"
          git push origin HEAD:main
