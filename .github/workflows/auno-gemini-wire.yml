name: Wire Auno Gemini Provider

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auno-gemini-wire.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire Gemini configuration and Auto Video routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gemini = Path('apps/server/internal/ai/gemini.go')
          text = gemini.read_text()
          text = text.replace(
              'return openai.ChatCompletionNewParams{}, nil, errors.New("invalid Gemini multimodal part at index " + string(rune(index)))',
              'return openai.ChatCompletionNewParams{}, nil, err',
          )
          text = text.replace('for index, part := range request.Parts {', 'for _, part := range request.Parts {')
          gemini.write_text(text)

          config = Path('apps/server/internal/config/config.go')
          text = config.read_text()
          anchor = '\tOpenRouterAPIKey         string\n'
          insert = anchor + '\tAunoAIProvider           string\n\tGeminiAPIKey             string\n\tGeminiBaseURL            string\n\tGeminiTextGenerationModel string\n'
          if 'GeminiAPIKey' not in text:
              if anchor not in text:
                  raise SystemExit('missing config struct AI anchor')
              text = text.replace(anchor, insert, 1)

          anchor = '\t\tOpenRouterAPIKey:        strings.TrimSpace(getEnvDefault("OPENROUTER_API_KEY", "")),\n'
          insert = anchor + '\t\tAunoAIProvider:          getEnvEnum("AUNO_AI_PROVIDER", "auto", "auto", "gemini", "openrouter"),\n\t\tGeminiAPIKey:            strings.TrimSpace(getEnvWithFallbacks("AUNO_GEMINI_API_KEY", "", "GEMINI_API_KEY", "GOOGLE_API_KEY")),\n\t\tGeminiBaseURL:           strings.TrimSpace(getEnvDefault("AUNO_GEMINI_BASE_URL", "")),\n\t\tGeminiTextGenerationModel: strings.TrimSpace(getEnvDefault("AUNO_GEMINI_MODEL", "gemini-2.5-flash")),\n'
          if 'AunoAIProvider:' not in text:
              if anchor not in text:
                  raise SystemExit('missing config load AI anchor')
              text = text.replace(anchor, insert, 1)
          config.write_text(text)

          config_test = Path('apps/server/internal/config/config_test.go')
          text = config_test.read_text()
          anchor = '\t"OPENROUTER_API_KEY",\n'
          insert = anchor + '\t"AUNO_AI_PROVIDER",\n\t"AUNO_GEMINI_API_KEY",\n\t"GEMINI_API_KEY",\n\t"GOOGLE_API_KEY",\n\t"AUNO_GEMINI_BASE_URL",\n\t"AUNO_GEMINI_MODEL",\n'
          if '"AUNO_AI_PROVIDER"' not in text:
              if anchor not in text:
                  raise SystemExit('missing config test env anchor')
              text = text.replace(anchor, insert, 1)
          config_test.write_text(text)

          main = Path('apps/server/cmd/openpost/main.go')
          text = main.read_text()
          old = '''\tif contentGenerator != nil {
\t\tpostBuilder, err = postgeneration.New(contentGenerator, cfg.TextGenerationModel, aiPromptService)
\t\tif err != nil {
\t\t\tfatalfWithDiagnostics(diagnosticsReporter, "failed to initialize AI post builder: %v", err)
\t\t}
\t\tlog.Printf(
\t\t\t"AI post builder enabled with model %s provider %s zero_data_retention=%t",
\t\t\tcfg.TextGenerationModel,
\t\t\tcfg.ContentAIProvider,
\t\t\tcfg.ContentAIRequireZDR,
\t\t)
\t\tautoVideoPlanner, err = autovideo.New(contentGenerator, cfg.TextGenerationModel)
\t\tif err != nil {
\t\t\tfatalfWithDiagnostics(diagnosticsReporter, "failed to initialize Auno Auto Video planner: %v", err)
\t\t}
\t\tlog.Printf("Auno Auto Video planner enabled with model %s", cfg.TextGenerationModel)
\t}
'''
          new = '''\tif contentGenerator != nil {
\t\tpostBuilder, err = postgeneration.New(contentGenerator, cfg.TextGenerationModel, aiPromptService)
\t\tif err != nil {
\t\t\tfatalfWithDiagnostics(diagnosticsReporter, "failed to initialize AI post builder: %v", err)
\t\t}
\t\tlog.Printf(
\t\t\t"AI post builder enabled with model %s provider %s zero_data_retention=%t",
\t\t\tcfg.TextGenerationModel,
\t\t\tcfg.ContentAIProvider,
\t\t\tcfg.ContentAIRequireZDR,
\t\t)
\t}

\tvar autoVideoGenerator ai.Generator
\tautoVideoModel := cfg.TextGenerationModel
\tautoVideoProvider := "openrouter"
\tif cfg.AunoAIProvider == "gemini" || (cfg.AunoAIProvider == "auto" && cfg.GeminiAPIKey != "") {
\t\tif cfg.GeminiAPIKey != "" {
\t\t\tautoVideoGenerator, err = ai.NewGemini(ai.GeminiConfig{
\t\t\t\tAPIKey: cfg.GeminiAPIKey,
\t\t\t\tBaseURL: cfg.GeminiBaseURL,
\t\t\t\tTimeout: contentAIRequestTimeout,
\t\t\t\tMaxRetries: 2,
\t\t\t})
\t\t\tif err != nil {
\t\t\t\tfatalfWithDiagnostics(diagnosticsReporter, "failed to initialize Gemini Auto Video generator: %v", err)
\t\t\t}
\t\t\tautoVideoModel = cfg.GeminiTextGenerationModel
\t\t\tautoVideoProvider = "gemini"
\t\t}
\t} else if cfg.AunoAIProvider == "openrouter" || cfg.AunoAIProvider == "auto" {
\t\tautoVideoGenerator = contentGenerator
\t}
\tif autoVideoGenerator != nil {
\t\tautoVideoPlanner, err = autovideo.New(autoVideoGenerator, autoVideoModel)
\t\tif err != nil {
\t\t\tfatalfWithDiagnostics(diagnosticsReporter, "failed to initialize Auno Auto Video planner: %v", err)
\t\t}
\t\tlog.Printf("Auno Auto Video planner enabled with model %s via %s", autoVideoModel, autoVideoProvider)
\t}
'''
          if old not in text:
              raise SystemExit('missing main Auto Video AI anchor')
          text = text.replace(old, new, 1)
          main.write_text(text)

          env = Path('.env.example')
          text = env.read_text()
          anchor = 'OPENROUTER_API_KEY=\n'
          insert = anchor + '\n# Auno Auto Video AI routing. `auto` prefers Gemini when an official Gemini key is present,\n# then falls back to the existing OpenRouter content generator.\nAUNO_AI_PROVIDER=auto\nAUNO_GEMINI_API_KEY=\nAUNO_GEMINI_BASE_URL=\nAUNO_GEMINI_MODEL=gemini-2.5-flash\n'
          if 'AUNO_AI_PROVIDER=' not in text:
              if anchor not in text:
                  raise SystemExit('missing env OpenRouter anchor')
              text = text.replace(anchor, insert, 1)
          env.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/internal/ai/gemini.go apps/server/internal/config/config.go apps/server/internal/config/config_test.go apps/server/cmd/openpost/main.go .env.example
          git commit -m "feat: add official Gemini routing for Auto Video"
          git push origin HEAD:main
