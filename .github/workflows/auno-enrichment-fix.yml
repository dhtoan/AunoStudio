name: Fix Auno Auto Video Enrichment Metadata
on:
  push:
    branches: [main]
    paths: [.github/workflows/auno-enrichment-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch enrichment metadata preservation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/lib/auno/auto-video/enrichment.ts')
          text = path.read_text()

          old = "\tconst nextSidecar: AutoVideoSidecar = {\n\t\t...options.sidecar,\n\t\tgenerationVersion: options.sidecar.generationVersion + 1,\n\t\tupdatedAt: Date.now(),\n\t\tproviderManifest: { ...options.sidecar.providerManifest, voice: `${engine}:${voice}` },\n\t\tgenerationGraph: {\n\t\t\tversion: 1,\n\t\t\tblocks: options.sidecar.generationGraph?.blocks ?? [],\n\t\t\tmedia: { ...options.sidecar.generationGraph?.media, voices: assets }\n\t\t}\n\t};"
          new = "\tconst actualDurations = new Map(generated.map((entry) => [entry.scene.id, entry.duration]));\n\tconst nextSidecar: AutoVideoSidecar = {\n\t\t...options.sidecar,\n\t\tgenerationVersion: options.sidecar.generationVersion + 1,\n\t\tupdatedAt: Date.now(),\n\t\tstoryboard: {\n\t\t\t...options.sidecar.storyboard,\n\t\t\tscenes: options.sidecar.storyboard.scenes.map((scene) => ({\n\t\t\t\t...scene,\n\t\t\t\tdurationSeconds: Math.max(2, actualDurations.get(scene.id) ?? scene.durationSeconds)\n\t\t\t}))\n\t\t},\n\t\tproviderManifest: { ...options.sidecar.providerManifest, voice: `${engine}:${voice}` },\n\t\tgenerationGraph: {\n\t\t\t...options.sidecar.generationGraph,\n\t\t\tversion: 1,\n\t\t\tblocks: options.sidecar.generationGraph?.blocks ?? [],\n\t\t\tmedia: { ...options.sidecar.generationGraph?.media, voices: assets }\n\t\t}\n\t};"
          if old not in text: raise SystemExit('missing voice sidecar anchor')
          text = text.replace(old, new, 1)

          old = "\t\t\tgenerationGraph: {\n\t\t\t\tversion: 1,\n\t\t\t\tblocks: sidecar.generationGraph?.blocks ?? [],\n\t\t\t\tmedia: { ...sidecar.generationGraph?.media, captions: asset }\n\t\t\t}\n"
          new = "\t\t\tgenerationGraph: {\n\t\t\t\t...sidecar.generationGraph,\n\t\t\t\tversion: 1,\n\t\t\t\tblocks: sidecar.generationGraph?.blocks ?? [],\n\t\t\t\tmedia: { ...sidecar.generationGraph?.media, captions: asset }\n\t\t\t}\n"
          if old not in text: raise SystemExit('missing captions graph anchor')
          text = text.replace(old, new, 1)

          old = "\t\t\tgenerationGraph: {\n\t\t\t\tversion: 1,\n\t\t\t\tblocks: options.sidecar.generationGraph?.blocks ?? [],\n\t\t\t\tmedia: { ...options.sidecar.generationGraph?.media, music: asset }\n\t\t\t}\n"
          new = "\t\t\tgenerationGraph: {\n\t\t\t\t...options.sidecar.generationGraph,\n\t\t\t\tversion: 1,\n\t\t\t\tblocks: options.sidecar.generationGraph?.blocks ?? [],\n\t\t\t\tmedia: { ...options.sidecar.generationGraph?.media, music: asset }\n\t\t\t}\n"
          if old not in text: raise SystemExit('missing music graph anchor')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          path='apps/web/src/lib/auno/auto-video/enrichment.ts'
          encoded="$(base64 -w0 "$path")"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .sha)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='fix: preserve motion lineage during Auto Video enrichment' \
            -f branch=main -f content="$encoded" -f sha="$sha" >/dev/null
