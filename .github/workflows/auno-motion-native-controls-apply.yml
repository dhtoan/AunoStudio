name: Apply Native Auno Motion Controls
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auno-motion-native-controls-apply.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/auno_motion_native_controls_patch.py
          for path in \
            apps/web/src/lib/video-editor/project/types.ts \
            apps/web/src/lib/video-editor/sequences/composition-controls.ts \
            apps/web/src/lib/video-editor/components/composition-control-overrides.svelte \
            apps/web/src/lib/auno/motion/motion-composition.ts; do
            encoded="$(base64 -w0 "$path")"
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .sha)"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="feat: extend native Motion Composition controls" \
              -f branch=main -f content="$encoded" -f sha="$sha" >/dev/null
          done
