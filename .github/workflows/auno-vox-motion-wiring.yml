name: Apply Auno Vox motion wiring

on:
  push:
    paths:
      - .github/workflows/auno-vox-motion-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Vox motion style
        run: python3 scripts/auno_vox_motion_patch.py
      - name: Commit source wiring
        run: |
          git config user.name "Auno Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/auno-motion/src/styles.ts packages/auno-motion/src/planner.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: wire Vox documentary motion style"
          git push origin HEAD:main
