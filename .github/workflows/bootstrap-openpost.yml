name: Bootstrap OpenPost Foundation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-openpost.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-openpost-foundation
  cancel-in-progress: false

jobs:
  import-openpost:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Auno Studio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge pinned OpenPost foundation
        shell: bash
        env:
          UPSTREAM_SHA: d18b313e48ebd7311188d23c33044a9e9f1f77b7
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream-openpost >/dev/null 2>&1; then
            git remote set-url upstream-openpost https://github.com/getopenpost/openpost.git
          else
            git remote add upstream-openpost https://github.com/getopenpost/openpost.git
          fi

          git fetch upstream-openpost main --tags
          resolved="$(git rev-parse upstream-openpost/main)"
          if [[ "$resolved" != "$UPSTREAM_SHA" ]]; then
            echo "Pinned OpenPost SHA changed: expected $UPSTREAM_SHA, got $resolved" >&2
            exit 1
          fi

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD 2>/dev/null; then
            echo "OpenPost $UPSTREAM_SHA is already present."
          else
            set +e
            git merge "$UPSTREAM_SHA" --allow-unrelated-histories --no-edit
            merge_status=$?
            set -e

            if [[ $merge_status -ne 0 ]]; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              unexpected="$(printf '%s\n' "$conflicts" | grep -v '^README.md$' || true)"
              if [[ -n "$unexpected" ]]; then
                echo "Unexpected merge conflicts:" >&2
                printf '%s\n' "$unexpected" >&2
                git merge --abort
                exit 1
              fi

              git checkout --theirs README.md
              {
                printf '# Auno Studio\n\n'
                printf '> Auno Studio Web 2.0 is built on the OpenPost foundation and extends it with Auno Auto Video, AI media workflows, and the Auno Motion Engine.\n\n'
                printf 'Upstream foundation: [getopenpost/openpost](https://github.com/getopenpost/openpost) at `%s`.\n\n' "$UPSTREAM_SHA"
                printf '%s\n' '---'
                printf '\n'
                cat README.md
              } > README.auno.md
              mv README.auno.md README.md
              git add README.md
              git commit --no-edit
            fi
          fi

          mkdir -p docs/upstream
          cat > docs/upstream/openpost.md <<EOF
          # OpenPost Upstream

          Auno Studio Web 2.0 uses OpenPost as its application, editor, project, media, publishing, and self-hosting foundation.

          - Upstream repository: https://github.com/getopenpost/openpost
          - Remote name for developer checkouts: \`upstream-openpost\`
          - Upstream branch: \`main\`
          - Imported base commit: \`$UPSTREAM_SHA\`

          ## Updating the foundation

          \`\`\`bash
          git remote add upstream-openpost https://github.com/getopenpost/openpost.git 2>/dev/null || \\
            git remote set-url upstream-openpost https://github.com/getopenpost/openpost.git
          git fetch upstream-openpost main --tags
          git merge upstream-openpost/main
          \`\`\`

          Keep Auno-owned functionality in focused Auno modules/packages where practical. Avoid mass-renaming OpenPost internal package names, Go module paths, or \`OPENPOST_*\` compatibility configuration solely for branding.
          EOF

          git add docs/upstream/openpost.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: record OpenPost upstream base"
          fi

          git push origin HEAD:main
