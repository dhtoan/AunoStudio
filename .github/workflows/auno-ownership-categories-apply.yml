name: Apply Categorized Auto Video Ownership
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auno-ownership-categories-apply.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/auno_ownership_categories_patch.py
          for path in apps/web/src/routes/auto-video/+page.svelte apps/web/src/lib/auno/auto-video/enrichment.ts; do
            api_path="${path//+/%2B}"
            encoded="$(base64 -w0 "$path")"
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${api_path}?ref=main" --jq .sha)"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${api_path}" \
              -f message='feat: categorize Auto Video generated ownership' \
              -f branch=main -f content="$encoded" -f sha="$sha" >/dev/null
          done
