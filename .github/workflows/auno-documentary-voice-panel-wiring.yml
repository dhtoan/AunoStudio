name: Apply documentary voice panel wiring

on:
  push:
    paths:
      - .github/workflows/auno-documentary-voice-panel-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch documentary voice source
        run: python3 scripts/auno_documentary_voice_panel_patch.py
      - name: Commit source wiring
        run: |
          git config user.name "Auno Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/lib/auno/documentary/enrichment.ts apps/web/src/lib/auno/auto-video/enrichment.ts apps/web/src/lib/video-editor/components/auno-auto-video-panel.svelte
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add measured documentary voice reflow"
          git push origin HEAD:main
