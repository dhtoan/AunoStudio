name: Apply Auno documentary wizard wiring

on:
  push:
    paths:
      - .github/workflows/auno-documentary-wizard-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          handler = Path('apps/server/internal/api/handlers/auto_video_documentary.go')
          text = handler.read_text()
          old = '''\tif patch.Script != nil && !reflect.DeepEqual(current.Script, patch.Script) {\n\t\tnext.Script = patch.Script\n\t\tdocumentary.InvalidateFrom(&next, documentary.StepScript)\n\t\tmarkDocumentaryStep(&next, documentary.StepScript, patch.Script.Fingerprint)\n\t}\n'''
          new = '''\tif patch.Script != nil && !reflect.DeepEqual(current.Script, patch.Script) {\n\t\tprevious := documentary.Script{}\n\t\tif current.Script != nil {\n\t\t\tprevious = *current.Script\n\t\t}\n\t\tnormalized, normalizeErr := documentary.NormalizeEditedScript(\n\t\t\tcurrent.ID,\n\t\t\tnext.TargetDurationSeconds,\n\t\t\tprevious,\n\t\t\tpatch.Script.Text,\n\t\t)\n\t\tif normalizeErr != nil {\n\t\t\treturn nil, documentaryHTTPError(normalizeErr)\n\t\t}\n\t\tnext.Script = &normalized\n\t\tdocumentary.InvalidateFrom(&next, documentary.StepScript)\n\t\tmarkDocumentaryStep(&next, documentary.StepScript, normalized.Fingerprint)\n\t}\n'''
          if 'NormalizeEditedScript(' not in text:
              if old not in text:
                  raise SystemExit('script normalization anchor missing')
              text = text.replace(old, new, 1)
          handler.write_text(text)

          page = Path('apps/web/src/routes/auto-video/+page.svelte')
          text = page.read_text()
          import_anchor = "\timport MotionStyleCustomizer from '$lib/components/auno-motion/motion-style-customizer.svelte';\n"
          import_insert = import_anchor + "\timport DocumentaryWizard from '$lib/components/auno-documentary/documentary-wizard.svelte';\n"
          if 'DocumentaryWizard' not in text:
              if import_anchor not in text:
                  raise SystemExit('wizard import anchor missing')
              text = text.replace(import_anchor, import_insert, 1)
          gate_anchor = '\tconst gate = createWorkspaceGate();\n'
          gate_insert = gate_anchor + "\tlet creationMode = $state<'short-form' | 'documentary-long-form'>('short-form');\n"
          if 'let creationMode =' not in text:
              if gate_anchor not in text:
                  raise SystemExit('creation mode anchor missing')
              text = text.replace(gate_anchor, gate_insert, 1)
          text = text.replace('content.slice(0, 200_000)', 'content.slice(0, 50_000)')
          text = text.replace('planner text capped at 200k characters', 'planner text capped at 50k characters')

          header_end = '''\t</header>\n\n\t{#if error}<InlineNotice tone="error">{error}</InlineNotice>{/if}\n'''
          mode_block = '''\t</header>\n\n\t<div class="flex w-fit rounded-lg border bg-muted/20 p-1" aria-label="Auto Video mode">\n\t\t<Button\n\t\t\ttype="button"\n\t\t\tsize="sm"\n\t\t\tvariant={creationMode === 'short-form' ? 'default' : 'ghost'}\n\t\t\tonclick={() => (creationMode = 'short-form')}\n\t\t>\n\t\t\tShort-form\n\t\t</Button>\n\t\t<Button\n\t\t\ttype="button"\n\t\t\tsize="sm"\n\t\t\tvariant={creationMode === 'documentary-long-form' ? 'default' : 'ghost'}\n\t\t\tonclick={() => (creationMode = 'documentary-long-form')}\n\t\t>\n\t\t\tDocumentary Long-form\n\t\t</Button>\n\t</div>\n\n\t{#if creationMode === 'documentary-long-form'}\n\t\t<DocumentaryWizard />\n\t{:else}\n\t{#if error}<InlineNotice tone="error">{error}</InlineNotice>{/if}\n'''
          if "creationMode === 'documentary-long-form'" not in text:
              if header_end not in text:
                  raise SystemExit('page header anchor missing')
              text = text.replace(header_end, mode_block, 1)
              closing = '\t{/if}\n</div>\n'
              pos = text.rfind(closing)
              if pos < 0:
                  raise SystemExit('page closing anchor missing')
              text = text[:pos] + '\t{/if}\n\t{/if}\n</div>\n' + text[pos + len(closing):]
          page.write_text(text)
          PY
      - name: Commit source wiring
        shell: bash
        run: |
          git config user.name "Auno Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/server/internal/api/handlers/auto_video_documentary.go apps/web/src/routes/auto-video/+page.svelte
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: wire documentary long form mode"
          git push origin HEAD:main
