services:
  auno-studio:
    image: ghcr.io/dhtoan/aunostudio:${AUNO_IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: auno-studio
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - .env
    ports:
      - "127.0.0.1:${AUNO_HOST_PORT:-8080}:8080"
    volumes:
      - auno_studio_data:/data
    environment:
      OPENPOST_PORT: "8080"
      OPENPOST_EDITION: selfhost
      OPENPOST_DATABASE_DRIVER: ${OPENPOST_DATABASE_DRIVER:-sqlite}
      OPENPOST_DATABASE_PATH: ${OPENPOST_DATABASE_PATH:-/data/db/auno-studio.db}
      OPENPOST_DATABASE_URL: ${OPENPOST_DATABASE_URL:-}
      OPENPOST_STORAGE_DRIVER: ${OPENPOST_STORAGE_DRIVER:-local}
      OPENPOST_MEDIA_PATH: ${OPENPOST_MEDIA_PATH:-/data/media}
      OPENPOST_TELEMETRY_ENABLED: ${OPENPOST_TELEMETRY_ENABLED:-false}
      OPENPOST_UPDATE_CHECK_ENABLED: ${OPENPOST_UPDATE_CHECK_ENABLED:-false}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/api/v1/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  auno_studio_data:
